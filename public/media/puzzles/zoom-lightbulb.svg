<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="A glowing light bulb">
  <defs>
    <radialGradient id="glassGrad" cx="42%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="45%" stop-color="#ffe9a8"/>
      <stop offset="80%" stop-color="#fdc94a"/>
      <stop offset="100%" stop-color="#f0a91c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#ffdf7a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffdf7a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffdf7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e99a6"/>
      <stop offset="18%" stop-color="#e2e8ee"/>
      <stop offset="42%" stop-color="#b6c0ca"/>
      <stop offset="70%" stop-color="#e8edf2"/>
      <stop offset="100%" stop-color="#7f8a97"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#ffffff"/>
  <circle cx="300" cy="250" r="230" fill="url(#halo)"/>

  <!-- rays -->
  <g stroke="#f6b93b" stroke-width="13" stroke-linecap="round" opacity="0.75">
    <line x1="300" y1="42" x2="300" y2="8"/>
    <line x1="128" y1="112" x2="104" y2="88"/>
    <line x1="472" y1="112" x2="496" y2="88"/>
    <line x1="72" y1="262" x2="34" y2="262"/>
    <line x1="528" y1="262" x2="566" y2="262"/>
    <line x1="140" y1="404" x2="112" y2="430"/>
    <line x1="460" y1="404" x2="488" y2="430"/>
  </g>

  <!-- glass envelope -->
  <path d="M300 70c-84 0-152 66-152 148 0 52 26 88 52 116 20 22 30 40 33 62h134c3-22 13-40 33-62 26-28 52-64 52-116 0-82-68-148-152-148z"
        fill="url(#glassGrad)" stroke="#c98a12" stroke-width="7"/>

  <!-- glass highlight -->
  <path d="M232 148c-22 24-34 54-33 88" fill="none" stroke="#fffdf5" stroke-width="19" stroke-linecap="round" opacity="0.95"/>
  <ellipse cx="248" cy="132" rx="20" ry="13" fill="#ffffff" opacity="0.9" transform="rotate(-32 248 132)"/>

  <!-- filament -->
  <g fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round">
    <path d="M262 322v-44"/>
    <path d="M338 322v-44"/>
    <path d="M262 278c0-26 14-40 38-40s38 14 38 40"/>
  </g>
  <path d="M264 246c8-16 18 16 26 0s18 16 26 0s16 12 22 2"
        fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>

  <!-- screw base -->
  <rect x="248" y="396" width="104" height="30" rx="8" fill="url(#metal)" stroke="#6b7580" stroke-width="4"/>
  <rect x="244" y="428" width="112" height="26" rx="7" fill="url(#metal)" stroke="#6b7580" stroke-width="4"/>
  <rect x="248" y="456" width="104" height="26" rx="7" fill="url(#metal)" stroke="#6b7580" stroke-width="4"/>
  <rect x="254" y="484" width="92" height="24" rx="7" fill="url(#metal)" stroke="#6b7580" stroke-width="4"/>
  <path d="M268 510h64l-14 26h-36z" fill="#9aa4af" stroke="#6b7580" stroke-width="4"/>
  <ellipse cx="300" cy="538" rx="20" ry="10" fill="#4b5563"/>
</svg>
